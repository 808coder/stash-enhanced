fragment ConfigTranslationData on ConfigTranslationResult {
  provider
  targetLanguage
  applyWithoutReview
  languageMappings {
    tagId
    languageCode
  }
  openai {
    baseURL
    model
    apiKey
    systemPrompt
  }
  defaultSystemPrompt
}

fragment SceneFieldTranslationData on SceneFieldTranslation {
  source
  current
  translation
  language
}

fragment SceneTranslationData on SceneTranslation {
  provider
  saved
  warnings
  title {
    ...SceneFieldTranslationData
  }
  details {
    ...SceneFieldTranslationData
  }
}
