fragment ConfigTombstonesData on ConfigTombstonesResult {
  record
  previouslyDeletedTagId
  reasons {
    name
    color
  }
}

fragment TombstoneData on Tombstone {
  id
  deleted_at
  origin
  reason
  scene_id
  title
  code
  date
  urls
  stash_ids {
    endpoint
    stash_id
  }
  original_title
  original_details
  details
  rating100
  o_counter
  play_count
  scene_created_at
  studio {
    name
    stash_ids {
      endpoint
      stash_id
    }
  }
  performers {
    name
    gender
    stash_ids {
      endpoint
      stash_id
    }
    performer {
      id
      gender
    }
  }
  tags
  tag_items {
    name
    tag {
      id
    }
  }
  files {
    id
    basename
    path
    size
    duration
    width
    height
    video_codec
    bit_rate
    oshash
    md5
    phash
  }
}
