query FindTombstones(
  $tombstone_filter: TombstoneFilterInput
  $filter: FindFilterType
) {
  findTombstones(tombstone_filter: $tombstone_filter, filter: $filter) {
    count
    manual_count
    clean_count
    matches {
      matched_keys
      tombstone {
        ...TombstoneData
      }
    }
  }
}
