# Scene tombstone settings. Kept in its own file (using extend) to limit merge
# conflicts with upstream.

type ConfigTombstonesResult {
  "If true, a tombstone is recorded when a scene is deleted. Defaults to true"
  record: Boolean!
  "Tag added to rescanned scenes that were deleted manually. Null means a tag named 'Previously deleted' is used"
  previouslyDeletedTagId: ID
}

input ConfigTombstonesInput {
  record: Boolean
  "Null leaves the setting unchanged; an empty string clears it"
  previouslyDeletedTagId: ID
}

extend type ConfigResult {
  tombstones: ConfigTombstonesResult!
}

extend type Mutation {
  configureTombstones(input: ConfigTombstonesInput!): ConfigTombstonesResult!
}
