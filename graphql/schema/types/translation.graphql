# Machine translation of metadata through interchangeable translation providers.
# Kept in its own file (using extend) to limit merge conflicts with upstream.

enum TranslationProvider {
  "Translation is disabled"
  NONE
  "OpenAI-compatible chat completions API: Ollama, LM Studio, vLLM or a cloud service"
  OPENAI_COMPATIBLE
}

"Maps a language tag to the language code of the scenes carrying it"
type TranslationLanguageMapping {
  tagId: ID!
  "Language code, e.g. ja"
  languageCode: String!
}

input TranslationLanguageMappingInput {
  tagId: ID!
  "Language code, e.g. ja"
  languageCode: String!
}

type ConfigTranslationOpenAIResult {
  "API root including the version, e.g. http://192.168.1.50:11434/v1"
  baseURL: String!
  model: String!
  "Optional; local servers usually need none"
  apiKey: String!
  "Empty means the default system prompt is used"
  systemPrompt: String!
}

input ConfigTranslationOpenAIInput {
  "API root including the version, e.g. http://192.168.1.50:11434/v1"
  baseURL: String
  model: String
  "Optional; local servers usually need none"
  apiKey: String
  "Empty means the default system prompt is used"
  systemPrompt: String
}

type ConfigTranslationResult {
  "Active translation provider"
  provider: TranslationProvider!
  "Language code metadata is translated into. Defaults to en"
  targetLanguage: String!
  "If true, translating a single scene saves directly instead of opening the review dialog"
  applyWithoutReview: Boolean!
  languageMappings: [TranslationLanguageMapping!]!
  openai: ConfigTranslationOpenAIResult!
  "System prompt used when openai.systemPrompt is empty"
  defaultSystemPrompt: String!
}

input ConfigTranslationInput {
  provider: TranslationProvider
  targetLanguage: String
  applyWithoutReview: Boolean
  "Replaces all language mappings"
  languageMappings: [TranslationLanguageMappingInput!]
  openai: ConfigTranslationOpenAIInput
}

type TranslationTestResult {
  success: Boolean!
  "Sample text that was translated"
  source: String!
  translation: String
  error: String
}

extend type ConfigResult {
  translation: ConfigTranslationResult!
}

extend type Query {
  """
  Translates a sample text with the active provider.
  Fields set in input override the saved configuration; nothing is saved.
  """
  testTranslation(input: ConfigTranslationInput!): TranslationTestResult!
}

extend type Mutation {
  configureTranslation(input: ConfigTranslationInput!): ConfigTranslationResult!
}

"Translation of one scene field"
type SceneFieldTranslation {
  "Text that was translated; becomes the original metadata when applied"
  source: String!
  "Value of the field before the translation"
  current: String!
  translation: String!
  "Language code of the source text"
  language: String!
}

type SceneTranslation {
  scene: Scene!
  "Translation provider and model, e.g. openai_compatible:qwen3:14b"
  provider: String!
  "Null if the title was not translated"
  title: SceneFieldTranslation
  "Null if the details were not translated"
  details: SceneFieldTranslation
  warnings: [String!]!
  "True if the translation was saved"
  saved: Boolean!
}

input SceneFieldTranslationInput {
  source: String!
  translation: String!
  language: String!
}

input SceneTranslationApplyInput {
  id: ID!
  provider: String!
  "Omit to leave the title unchanged"
  title: SceneFieldTranslationInput
  "Omit to leave the details unchanged"
  details: SceneFieldTranslationInput
}

input TranslateMetadataInput {
  "Translate scene titles and details. Defaults to true"
  scenes: Boolean
  "Scenes to translate. If empty, all scenes with a mapped language tag are translated"
  sceneIds: [ID!]
  "Re-translate scene fields from their original metadata, even if they are no longer in the source language"
  force: Boolean
  """
  Translate the names of all tags in a mapped source language. Tags are renamed
  for every scene, image, gallery etc. and keep the old name as an alias. Defaults to false
  """
  tags: Boolean
  """
  If a tag's translation is the name or alias of another tag, merge the tag into it.
  Otherwise the tag is skipped. Defaults to true
  """
  mergeOnCollision: Boolean
}

extend type Mutation {
  "Translates title and details of a scene without saving, for review"
  sceneTranslatePreview(id: ID!, force: Boolean): SceneTranslation!
  "Translates title and details of a scene and saves the result"
  sceneTranslate(id: ID!, force: Boolean): SceneTranslation!
  "Saves a reviewed translation"
  sceneTranslateApply(input: SceneTranslationApplyInput!): Scene!
  "Writes the original metadata back and removes the translation custom fields"
  scenesRestoreOriginal(ids: [ID!]!): [Scene!]!
  "Translates and saves scenes and tags in a job. Returns the job ID"
  metadataTranslate(input: TranslateMetadataInput!): ID!
}
