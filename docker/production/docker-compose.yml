# APPNICENAME=Stash
# APPDESCRIPTION=An organizer for your porn, written in Go
services:
  stash:
    image: 808coder/stash-enhanced:latest
    container_name: stash
    restart: unless-stopped
    ## the container's port must be the same with the STASH_PORT in the environment section
    ports:
      - "9999:9999"
    ## If you intend to use stash's DLNA functionality uncomment the below network mode and comment out the above ports section
    # network_mode: host
    ## Uncomment to pass the Intel/AMD GPU into the container for hardware transcoding (VAAPI)
    ## The container runs as root, so no group_add is needed
    # devices:
    #   - /dev/dri:/dev/dri
    logging:
      driver: "json-file"
      options:
        max-file: "10"
        max-size: "2m"
    environment:
      - STASH_STASH=/data/
      - STASH_GENERATED=/generated/
      - STASH_METADATA=/metadata/
      - STASH_CACHE=/cache/
      ## Adjust below to change default port (9999)
      - STASH_PORT=9999
      ## Set your timezone, e.g. America/New_York or Europe/Berlin
      ## see https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
      - TZ=Etc/UTC
      ## Render node used for VAAPI. renderD128 is the default and the first GPU regardless of GPU generation;
      ## only change it (e.g. to renderD129) if the host has multiple GPUs.
      # - STASH_HW_DRI_DEVICE=/dev/dri/renderD128
      ## Override only if libva picks the wrong driver:
      ## i965 for Intel up to Gen9 (e.g. Ivy Bridge), iHD for Broadwell and newer.
      # - LIBVA_DRIVER_NAME=i965
    volumes:
      ## Adjust below paths (the left part) to your liking.
      ## E.g. you can change ./config:/root/.stash to ./stash:/root/.stash
      ## The left part is the path on your host, the right part is the path in the stash container.

      ## Keep configs, scrapers, and plugins here.
      - ./config:/root/.stash
      ## Point this at your collection.
      ## The left side is where your collection is on your host, the right side is where it will be in stash.
      - ./data:/data
      ## This is where your stash's metadata lives
      - ./metadata:/metadata
      ## Any other cache content.
      - ./cache:/cache
      ## Where to store binary blob data (scene covers, images)
      - ./blobs:/blobs
      ## Where to store generated content (screenshots,previews,transcodes,sprites)
      - ./generated:/generated
