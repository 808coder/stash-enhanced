changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: "🚀 Features"
      labels:
        - feature
        - enhancement
    - title: "🐛 Bug Fixes"
      labels:
        - bug
        - fix
    - title: "🔧 Improvements"
      labels:
        - improvement
        - refactor
    - title: "📦 Other Changes"
      labels:
        - "*"
