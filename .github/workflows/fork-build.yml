# Fork CI/CD for 808coder/stash-enhanced. See docs/CI.md.
#
# Replaces the upstream build.yml / build-compiler.yml, which are kept
# unchanged (to avoid merge conflicts) but disabled via `gh workflow disable`.
name: Fork Build

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  release:
    types: [ published ]
  # Manual run, e.g. on develop before tagging a release: also builds and
  # smoke-tests Windows, which PRs and develop pushes skip. Pushes nothing.
  workflow_dispatch:

concurrency:
  # event_name keeps a manual run from cancelling a develop push run (same ref)
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Only used by cross-compiled build platforms (everything but linux).
  COMPILER_IMAGE: ghcr.io/stashapp/compiler:14
  DOCKER_IMAGE: 808coder/stash-enhanced
  # Builds from develop and releases are this fork's official builds; PR builds are not.
  OFFICIAL_BUILD: ${{ github.event_name != 'pull_request' }}
  # Points the built-in update check at this fork's releases.
  UPDATE_REPO: ${{ github.repository }}

jobs:
  # Job 1: Generate code and build UI.
  # Produces artifacts (generated Go files + UI build) consumed by test and build jobs.
  generate:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'

    # pnpm version is read from the packageManager field in package.json
    - name: Install pnpm
      uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061
      with:
        package_json_file: ui/v2.5/package.json

    # ensure pnpm store path exists to fix post setup node.js error
    # https://github.com/actions/setup-node/issues/1137#issuecomment-2508963254
    - name: Ensure pnpm store path exists
      run: mkdir -p "$( pnpm store path --silent )"

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'pnpm'
        cache-dependency-path: ui/v2.5/pnpm-lock.yaml

    - name: Install UI dependencies
      run: make pre-ui

    - name: Generate
      run: make generate

    - name: Cache UI build
      uses: actions/cache@v5
      id: cache-ui
      with:
        path: ui/v2.5/build
        key: ${{ runner.os }}-ui-build-${{ hashFiles('ui/v2.5/pnpm-lock.yaml', 'ui/v2.5/public/**', 'ui/v2.5/src/**', 'graphql/**/*.graphql') }}

    - name: Validate UI
      # skip UI validation for pull requests if UI is unchanged
      if: ${{ github.event_name != 'pull_request' || steps.cache-ui.outputs.cache-hit != 'true' }}
      run: make validate-ui

    - name: Build UI
      # skip UI build for pull requests if UI is unchanged (UI was cached)
      if: ${{ github.event_name != 'pull_request' || steps.cache-ui.outputs.cache-hit != 'true' }}
      run: make ui

    - name: Upload generated artifacts
      uses: actions/upload-artifact@v7
      with:
        name: generated
        retention-days: 1
        path: |
          internal/api/generated_exec.go
          internal/api/generated_models.go
          ui/v2.5/build/
          ui/login/locales/

  # Job 2: Integration tests (native Go + GCC for CGO/SQLite).
  test:
    needs: generate
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'

    - name: Download generated artifacts
      uses: actions/download-artifact@v8
      with:
        name: generated

    - name: Test Backend
      run: make it

  # Job 3: Build binaries, one runner per platform.
  #
  # Each platform runs `make build-cc-<platform>` (see the Makefile) and must
  # write a single dist/stash-* binary; list it in the release job's RELEASE_FILES.
  # - linux:  built natively on the runner (host-arch only)
  # - others: built inside $COMPILER_IMAGE (cross-compilers)
  #
  # Windows is only built for releases and manual runs (workflow_dispatch).
  # (`include` can't be used for this: its entries survive `exclude`.)
  build:
    needs: generate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON((github.event_name == 'release' || github.event_name == 'workflow_dispatch') && '["linux", "windows"]' || '["linux"]') }}

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Download generated artifacts
      uses: actions/download-artifact@v8
      with:
        name: generated

    # --- native build ---
    - name: Setup Go
      if: ${{ matrix.platform == 'linux' }}
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'

    - name: Build (${{ matrix.platform }}, native)
      if: ${{ matrix.platform == 'linux' }}
      run: make build-cc-${{ matrix.platform }}

    # --- cross build in compiler container ---
    - name: Cache Go build
      if: ${{ matrix.platform != 'linux' }}
      uses: actions/cache@v5
      with:
        path: .go-cache
        key: ${{ runner.os }}-go-cache-${{ matrix.platform }}-${{ hashFiles('go.mod', '**/go.sum') }}

    - name: Build (${{ matrix.platform }}, container)
      if: ${{ matrix.platform != 'linux' }}
      run: |
        mkdir -p .go-cache
        docker run --rm \
          --mount type=bind,source="$(pwd)",target=/stash \
          --mount type=bind,source="$(pwd)/.go-cache",target=/root/.cache/go-build \
          --env OFFICIAL_BUILD --env UPDATE_REPO \
          -w /stash "$COMPILER_IMAGE" \
          /bin/bash -c "git config --global --add safe.directory /stash && make build-cc-${{ matrix.platform }}"

    - name: Upload build artifact
      uses: actions/upload-artifact@v7
      with:
        name: build-${{ matrix.platform }}
        retention-days: 1
        path: dist/stash-*
        if-no-files-found: error

  # Job 4: Start the Windows binary on a Windows runner (no GPU, so no
  # hardware acceleration check). Runs whenever Windows is built.
  smoke-windows:
    needs: build
    if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    # a fatal error can open a dialog on Windows, which would hang the job
    timeout-minutes: 5
    steps:
    - name: Download windows binary
      uses: actions/download-artifact@v8
      with:
        name: build-windows

    - name: Smoke test
      shell: pwsh
      run: |
        $out = & .\stash-win.exe --version
        if ($LASTEXITCODE -ne 0 -or -not $out) { exit 1 }
        Write-Output $out

  # Job 5: Docker image.
  # Always built and smoke-tested; pushed to Docker Hub only for published
  # v* releases (:latest + :<tag>).
  docker:
    needs: [test, build, smoke-windows]
    # smoke-windows is skipped on PRs and develop pushes; a failed one blocks the push
    if: >-
      ${{ !cancelled()
      && needs.test.result == 'success'
      && needs.build.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.smoke-windows.result) }}
    runs-on: ubuntu-24.04
    env:
      # don't upload a .dockerbuild record artifact per run (kept for the repo's retention period)
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
    - uses: actions/checkout@v6

    - name: Download linux binary
      uses: actions/download-artifact@v8
      with:
        name: build-linux
        path: dist

    - name: Prepare build context
      run: chmod +x dist/stash-*

    - name: Determine image tags
      id: tags
      run: |
        tags=""
        if [[ "$GITHUB_EVENT_NAME" == "release" && "$GITHUB_REF" == refs/tags/v* ]]; then
          tags="$DOCKER_IMAGE:latest,$DOCKER_IMAGE:$GITHUB_REF_NAME"
        fi
        echo "push=$([[ -n "$tags" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        echo "tags=$tags" >> "$GITHUB_OUTPUT"

    - uses: docker/setup-buildx-action@v3

    - name: Build image for smoke test
      uses: docker/build-push-action@v6
      with:
        context: dist
        file: docker/ci/x86_64/Dockerfile
        platforms: linux/amd64
        load: true
        tags: stash-enhanced:smoke
        cache-from: type=gha,scope=docker
        cache-to: type=gha,scope=docker,mode=max

    - name: Smoke test
      run: docker run --rm stash-enhanced:smoke stash --version

    - name: Check VAAPI drivers
      # no GPU in CI: only verify the drivers and vainfo are installed, not that they work
      run: |
        docker run --rm stash-enhanced:smoke sh -c '
          set -e
          test -f /usr/lib/dri/i965_drv_video.so
          test -f /usr/lib/dri/iHD_drv_video.so
          test -x "$(command -v vainfo)"
        '

    - name: Log in to Docker Hub
      if: ${{ steps.tags.outputs.push == 'true' }}
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Push image
      if: ${{ steps.tags.outputs.push == 'true' }}
      uses: docker/build-push-action@v6
      with:
        context: dist
        file: docker/ci/x86_64/Dockerfile
        # add more platforms here once their binaries are built (see build matrix)
        platforms: linux/amd64
        push: true
        tags: ${{ steps.tags.outputs.tags }}
        labels: |
          org.opencontainers.image.title=Stash Enhanced
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=gha,scope=docker

  # Job 6: Attach assets to a published v* release.
  # Don't create tags starting with "v" for anything other than real releases.
  # No status check in `if`, so it only runs if all needed jobs succeeded.
  release:
    needs: [test, build, smoke-windows]
    if: ${{ github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      # binaries from the build matrix; extend when adding platforms
      RELEASE_FILES: dist/stash-linux dist/stash-win.exe
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Download all build artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts

    # upload-artifact strips the common dist/ prefix, so files are at the artifact root
    - name: Collect binaries
      run: |
        mkdir -p dist
        cp artifacts/build-*/* dist/
        chmod +x dist/*

    - name: Zip UI
      run: cd artifacts/generated/ui/v2.5/build && zip -r "$GITHUB_WORKSPACE/dist/stash-ui.zip" .

    - name: Generate checksums
      run: |
        version="$(git describe --tags --exclude latest_develop)"
        echo "$version" | tee CHECKSUMS_SHA1
        (cd dist && sha1sum stash-*) | tee -a CHECKSUMS_SHA1

    - name: Upload release assets
      run: |
        read -ra files <<< "$RELEASE_FILES"
        gh release upload "$GITHUB_REF_NAME" --clobber \
          "${files[@]}" dist/stash-ui.zip CHECKSUMS_SHA1
        # the update check uses /releases/latest, which skips prereleases
        gh release edit "$GITHUB_REF_NAME" --prerelease=false --latest
